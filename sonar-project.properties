# Configuração do SonarQube para o projeto Delivery Backend
# Documentação: https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Informações do Projeto
sonar.projectKey=delivery-backend
sonar.projectName=Delivery Backend - Spring Boot 4
sonar.projectVersion=0.0.1-SNAPSHOT

# Caminho do código fonte
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java

# Encoding
sonar.sourceEncoding=UTF-8

# Java
sonar.java.source=25
sonar.java.binaries=app/build/classes/java/main
sonar.java.test.binaries=app/build/classes/java/test
sonar.java.libraries=app/build/libs

# Cobertura de Testes (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=app/build/test-results/test

# Checkstyle
sonar.java.checkstyle.reportPaths=app/build/reports/checkstyle/main.xml,app/build/reports/checkstyle/test.xml

# Exclusões (alinhado com JaCoCo)
# Entry points da aplicação (apenas delegam para frameworks)
sonar.coverage.exclusions=\
  **/DeliveryApplication.java,\
  **/common/logging/**

# Exclusões de análise (arquivos gerados, configurações, etc)
sonar.exclusions=\
  **/build/**,\
  **/target/**,\
  **/*.gradle,\
  **/gradlew*,\
  **/gradle/**,\
  **/*.yml,\
  **/*.yaml,\
  **/*.xml,\
  **/*.properties

# Exclusões de duplicação
sonar.cpd.exclusions=\
  **/test/**,\
  **/config/**

# Regras de Qualidade
# Cobertura mínima esperada
sonar.coverage.minimum=90.0

# Complexidade ciclomática máxima (alinhado com Checkstyle)
sonar.java.cyclomaticComplexity.maximum=10

# Tamanho máximo de métodos (alinhado com Checkstyle)
sonar.java.methodLength.maximum=50

# Tamanho máximo de arquivos (alinhado com Checkstyle)
sonar.java.fileLength.maximum=500

# Número máximo de parâmetros (alinhado com Checkstyle)
sonar.java.parameterNumber.maximum=5

# Links
sonar.links.homepage=https://github.com/seu-usuario/spring-boot-4-poc
sonar.links.ci=https://github.com/seu-usuario/spring-boot-4-poc/actions
sonar.links.issue=https://github.com/seu-usuario/spring-boot-4-poc/issues
sonar.links.scm=https://github.com/seu-usuario/spring-boot-4-poc

# Configurações adicionais
sonar.verbose=false
sonar.log.level=INFO
