plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'jacoco'
    id 'checkstyle'
    id 'org.sonarqube' version '5.1.0.4882'
}

group = 'com.poc'
version = '0.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    testLogging {
        showStandardStreams = true
        events 'PASSED', 'FAILED', 'SKIPPED'
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.junit:junit-bom:6.0.1"
    }
}

def testcontainersVersion = '1.21.3'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // SpringDoc OpenAPI 3 - Documentação automática da API (v3.0.0 para Spring Boot 4)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    // implementation 'org.springframework.boot:spring-boot-starter-cache'
    // implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.14.0'
    testImplementation 'org.instancio:instancio-junit:3.6.0'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    testLogging {
        showStandardStreams = true
        events 'PASSED', 'FAILED', 'SKIPPED'
    }
    finalizedBy jacocoTestReport  // Gera relatório automaticamente após os testes
}

jacocoTestReport {
    dependsOn test  // Garante que os testes rodem antes
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/DeliveryApplication.class'  // Exclui entry point da aplicação
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80  // Temporariamente reduzido para 80%
            }
        }
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70  // Temporariamente reduzido para 70% por classe
            }
            excludes = [
                'com.poc.delivery.DeliveryApplication',  // Exclui entry point
                'com.poc.delivery.common.FlywayConfig',  // Exclui configuração de infra
                'com.poc.delivery.common.logging.HttpRequestLoggingFilter',  // Exclui filtro de logging
                'com.poc.delivery.api.OpenApiConfig'  // Exclui configuração de OpenAPI (infra)
            ]
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/DeliveryApplication.class'  // Exclui entry point da verificação
            ])
        }))
    }
}

// Garante que a verificação de cobertura rode no build
tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

checkstyle {
    toolVersion = '10.14.0'
    configDirectory = file("config/checkstyle")
    maxWarnings = 20  // Temporariamente permite warnings para focar em correções críticas
    ignoreFailures = false  // Não ignora falhas do checkstyle
}

// Garante que checkstyle rode antes dos testes
tasks.named('test') {
    dependsOn 'checkstyleMain', 'checkstyleTest'
}

// Garante que checkstyle rode no build
tasks.named('check') {
    dependsOn 'checkstyleMain', 'checkstyleTest'
}
